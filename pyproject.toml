[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quilt-canon-radio"
version = "0.1.0"
description = "Continuous TTS broadcast of Quilt canon lore via ElevenLabs"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "SuperInstance", email = "[email protected]"}]
keywords = ["tts", "elevenlabs", "canon", "quilt", "audio", "broadcast"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.scripts]
quilt-canon-radio = "quilt_canon_radio.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quilt_canon_radio*"]
